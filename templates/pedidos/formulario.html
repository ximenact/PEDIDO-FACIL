
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | PedidoFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'productos:lista' %}">PedidoFácil</a>
            <div class="d-flex gap-3 align-items-center">
                <a class="text-white" href="{% url 'productos:lista' %}">Productos</a>
                <a class="text-white" href="{% url 'pedidos:lista' %}">Pedidos</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="mb-4">{{ titulo }}</h1>

                        <form method="post" id="pedido-form" novalidate>
                            {% csrf_token %}

                            {% for field in form %}
                                <div class="mb-3">
                                    <label for="{{ field.id_for_label }}" class="form-label">
                                        {{ field.label }}
                                    </label>

                                    {{ field }}

                                    {% for error in field.errors %}
                                        <div class="text-danger small">{{ error }}</div>
                                    {% endfor %}

                                    <div class="text-danger small js-error"
                                         aria-live="polite"></div>
                                </div>
                            {% endfor %}

                            {% if form.non_field_errors %}
                                <div class="alert alert-danger">
                                    {{ form.non_field_errors }}
                                </div>
                            {% endif %}

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a href="{% url 'pedidos:lista' %}"
                               class="btn btn-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{% static 'js/pedidos.js' %}"></script>
</body>
</html>
